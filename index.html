<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>シフト管理板</title>
<style>
  :root {
    --bg: #F6F3EC;
    --ink: #22282F;
    --border: #DED7C6;
    --green: #2F6F4E;
    --orange: #B5541E;
    --orange-bg: #FBE9D6;
    --rose: #C1666B;
    --rose-bg: #F3E3E3;
    --muted: #7A756A;
    --muted2: #9A968C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  .disp { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; }
  header { background: var(--ink); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .logo-badge {
    width: 36px; height: 36px; border-radius: 4px; background: var(--orange);
    display: flex; align-items: center; justify-content: center; color: #F6F3EC; font-size: 18px;
  }
  h1 { margin: 0; font-size: 20px; color: #F6F3EC; }
  h1 .tag { font-size: 12px; font-weight: 400; margin-left: 8px; color: #E0A458; }
  .sub { margin: 2px 0 0; font-size: 12px; color: #B8B2A2; }
  .flash { font-size: 12px; color: #E0A458; }
  .switch-link { font-size: 12px; color: #B8B2A2; text-decoration: underline; cursor: pointer; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .month-nav button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px 14px; border-radius: 999px; }
  .month-nav button:hover { background: rgba(0,0,0,0.05); }
  .month-label { font-size: 18px; font-weight: 700; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--green); border-color: var(--green); }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .card + .card { margin-top: 12px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .date-label { display: flex; align-items: baseline; gap: 6px; }
  .date-num { font-weight: 700; font-size: 14px; }
  .date-dow { font-size: 12px; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; margin-left: 4px; }
  .badge-weekend { background: var(--orange-bg); color: var(--orange); }
  .badge-locked { background: var(--rose-bg); color: var(--rose); display: inline-flex; align-items: center; gap: 3px; }
  .slot-btn {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
    border-radius: 4px; font-size: 14px; border: 1px solid var(--border); color: var(--muted);
    background: #fff; cursor: pointer; margin-top: 8px; width: 100%;
  }
  .slot-btn:first-of-type { margin-top: 12px; }
  .slot-btn.checked { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
  input[type=text], input[type=number], input[type=password], input[type=time] {
    width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; font-size: 14px;
  }
  label.field-label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
  .submit-btn, .save-btn, .add-btn {
    margin-top: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px;
    border-radius: 4px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; color: #fff;
  }
  .submit-btn { background: var(--green); }
  .save-btn { background: var(--ink); }
  .add-btn { background: var(--orange); padding: 8px 14px; font-size: 13px; margin-top: 8px; }
  .holiday-chip {
    font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);
    color: var(--muted2); background: #fff; cursor: pointer; margin: 2px;
  }
  .holiday-chip.active { background: var(--orange); border-color: var(--orange); color: #fff; }
  .assign-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .assign-row:first-child { margin-top: 0; }
  .assign-label { font-size: 12px; color: var(--muted); width: 130px; flex-shrink: 0; }
  select { flex: 1; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 14px; }
  table { width: 100%; font-size: 14px; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px 6px 0; }
  td { padding: 8px 8px 8px 0; border-top: 1px solid #EFEAE0; vertical-align: top; }
  .footer-note { max-width: 900px; margin: 0 auto; padding: 8px 20px 40px; font-size: 12px; color: var(--muted2); }
  .center-msg { text-align: center; padding: 100px 20px; color: var(--muted); }
  .slot-editor-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .slot-editor-row input[type=text] { flex: 1; min-width: 100px; }
  .slot-editor-row input[type=time] { width: 110px; }
  .remove-btn {
    background: none; border: 1px solid var(--rose); color: var(--rose); border-radius: 4px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .staff-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .staff-row input[type=text], .staff-row input[type=number] { flex: 1; min-width: 90px; }
  .section-title { font-size: 13px; font-weight: 700; margin: 16px 0 4px; color: var(--muted); }
  .section-title:first-child { margin-top: 0; }
  .cost-total { font-size: 13px; color: var(--green); font-weight: 700; margin-top: 4px; }
  .grand-total { font-size: 16px; font-weight: 700; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .welcome-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .text-link { color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; font-size: 12px; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ==== ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください ====
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzOSPmWXfZTvMLiOa8bucfhU3UgJdUqxucc7NWDCq2WMRHsjHqPFRDm34F8S3og8i_b/exec",
  ADMIN_PASSWORD: "0310",
  LATE_GRACE_MINUTES: 1,
};

const WEEKDAY_JP = ["日", "月", "火", "水", "木", "金", "土"];
const DEFAULT_WEEKDAY_SLOTS = [{ id: "w1", label: "ワンオペ", start: "09:00", end: "18:00" }];
const DEFAULT_WEEKEND_SLOTS = [
  { id: "s1", label: "10:00〜15:00", start: "10:00", end: "15:00" },
  { id: "s2", label: "11:30〜16:30", start: "11:30", end: "16:30" },
];

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function daysInMonth(year, month) {
  const arr = [];
  const d = new Date(year, month, 1);
  while (d.getMonth() === month) { arr.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return arr;
}
function periodInfoFor(d) {
  const day = d.getDate(), y = d.getFullYear(), m = d.getMonth();
  if (day <= 15) {
    const deadline = new Date(y, m - 1, 20, 23, 59, 59);
    return { deadline, label: `${deadline.getMonth() + 1}/${deadline.getDate()}` };
  }
  const deadline = new Date(y, m, 5, 23, 59, 59);
  return { deadline, label: `${deadline.getMonth() + 1}/${deadline.getDate()}` };
}
function isLocked(d) { return new Date() > periodInfoFor(d).deadline; }
function effectiveLocked(d) {
  if (state.unlockedDates.includes(dateKey(d))) return false;
  return isLocked(d);
}
function readRoute() { return window.location.hash.replace("#", "").toLowerCase() === "admin" ? "admin" : "staff"; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid() { return "slot_" + Math.random().toString(36).slice(2, 9); }
function hmToMinutes(hm) {
  const [h, m] = String(hm).split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}
function slotHours(slot) {
  let mins = hmToMinutes(slot.end) - hmToMinutes(slot.start);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}
function fmtYen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }
function hmDiffMinutes(aIso, bIso) { return (new Date(bIso) - new Date(aIso)) / 60000; }
function calcHoursForPunches(records) {
  const sorted = [...records].sort((a, b) => new Date(a.time) - new Date(b.time));
  const inRec = sorted.find((r) => r.type === "in");
  const outRecs = sorted.filter((r) => r.type === "out");
  const outRec = outRecs.length ? outRecs[outRecs.length - 1] : null;
  if (!inRec || !outRec) return 0;
  const grossMin = hmDiffMinutes(inRec.time, outRec.time);
  return grossMin > 0 ? grossMin / 60 : 0;
}
function firstInTime(records) {
  const sorted = records.filter((r) => r.type === "in").sort((a, b) => new Date(a.time) - new Date(b.time));
  return sorted.length ? new Date(sorted[0].time) : null;
}

async function apiGet(key) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data || data.value == null || data.value === "") return null;
    return JSON.parse(data.value);
  } catch (e) { console.error("apiGet failed", key, e); return null; }
}
async function apiSet(key, value) {
  try {
    await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", key, value: JSON.stringify(value) }),
    });
    return true;
  } catch (e) { console.error("apiSet failed", key, e); return false; }
}
async function apiList(prefix) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    return (data && data.keys) || [];
  } catch (e) { console.error("apiList failed", prefix, e); return []; }
}
async function apiListValues(prefix) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=listValues&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    const out = {};
    for (const item of (data && data.items) || []) {
      if (item.value == null || item.value === "") continue;
      try { out[item.key] = JSON.parse(item.value); } catch (e) { /* skip malformed */ }
    }
    return out;
  } catch (e) { console.error("apiListValues failed", prefix, e); return {}; }
}
async function apiAction(payload) {
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    return await res.json();
  } catch (e) { console.error("apiAction failed", payload, e); return { error: String(e) }; }
}

// ---- app state ----
const state = {
  cursor: (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })(),
  route: readRoute(),
  tab: readRoute() === "admin" ? "admin" : "input",
  loading: true,
  saving: false,
  flash: "",
  adminAuthed: sessionStorage.getItem("adminAuthed") === "1",
  adminPasswordValue: null, // fetched from backend; null = not yet loaded
  showForgotPassword: false,
  forgotStep: "request", // "request" | "verify"
  forgotFlash: "",
  showAdminPasswordChange: false,
  staffAuthed: sessionStorage.getItem("staffAuthed") === "1",
  staffName: sessionStorage.getItem("staffAuthedName") || "",
  showPasswordChange: false,
  submitSuccess: false,
  holidays: [],
  unlockedDates: [],
  dateOverrides: {}, // dateKey -> custom slots array for that single day
  slotsSnapshot: null, // { weekday, weekend } frozen at the moment this month's shifts were confirmed
  editingDateSlots: null, // dateKey currently being edited, or null
  editingSlotsList: [],
  weekdaySlots: DEFAULT_WEEKDAY_SLOTS,
  weekendSlots: DEFAULT_WEEKEND_SLOTS,
  mySubmission: {},
  allSubmissions: {},
  staffDirectory: [], // [{name, wage, password}]
  confirmed: {},
  myRecord: null, // { rows, hoursTotal, wageTotal, lateCount }
  myRecordLoading: false,
  myRecordError: false,
};

// ---- 日本の祝日を自動計算 ----
const _holidayCache = {};
function nthMonday(year, month, n) {
  const d = new Date(year, month - 1, 1);
  let count = 0;
  while (true) {
    if (d.getDay() === 1) { count++; if (count === n) return new Date(d); }
    d.setDate(d.getDate() + 1);
  }
}
function vernalEquinox(year) {
  return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function autumnalEquinox(year) {
  return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
}
function getJapanHolidays(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const list = []; // { date: Date, name: string }
  const add = (m, d, name) => list.push({ date: new Date(year, m - 1, d), name });
  add(1, 1, "元日");
  list.push({ date: nthMonday(year, 1, 2), name: "成人の日" });
  add(2, 11, "建国記念の日");
  add(2, 23, "天皇誕生日");
  add(3, vernalEquinox(year), "春分の日");
  add(4, 29, "昭和の日");
  add(5, 3, "憲法記念日");
  add(5, 4, "みどりの日");
  add(5, 5, "こどもの日");
  list.push({ date: nthMonday(year, 7, 3), name: "海の日" });
  add(8, 11, "山の日");
  list.push({ date: nthMonday(year, 9, 3), name: "敬老の日" });
  add(9, autumnalEquinox(year), "秋分の日");
  list.push({ date: nthMonday(year, 10, 2), name: "スポーツの日" });
  add(11, 3, "文化の日");
  add(11, 23, "勤労感謝の日");

  const byKey = {};
  for (const h of list) byKey[dateKey(h.date)] = h.name;

  // 振替休日: 日曜の祝日の次の平日(まだ祝日でない日)を休日にする
  for (const h of [...list]) {
    if (h.date.getDay() === 0) {
      let sub = new Date(h.date);
      do { sub.setDate(sub.getDate() + 1); } while (byKey[dateKey(sub)]);
      byKey[dateKey(sub)] = "振替休日";
    }
  }
  // 国民の休日: 祝日と祝日に挟まれた平日(日曜でない)も休日にする
  const sortedKeys = Object.keys(byKey).sort();
  for (const k of sortedKeys) {
    const d = new Date(k + "T00:00:00");
    const next = new Date(d); next.setDate(next.getDate() + 2);
    const between = new Date(d); between.setDate(between.getDate() + 1);
    if (between.getDay() !== 0 && !byKey[dateKey(between)] && byKey[dateKey(next)]) {
      byKey[dateKey(between)] = "国民の休日";
    }
  }
  _holidayCache[year] = byKey;
  return byKey;
}
function isPublicHoliday(d) {
  return !!getJapanHolidays(d.getFullYear())[dateKey(d)];
}
function publicHolidayName(d) {
  return getJapanHolidays(d.getFullYear())[dateKey(d)] || "";
}

function isWeekendType(d) {
  const dow = d.getDay();
  return dow === 0 || dow === 6 || isPublicHoliday(d) || state.holidays.includes(dateKey(d));
}
function slotsForDate(d) {
  const override = state.dateOverrides[dateKey(d)];
  if (override && override.length) return override;
  return isWeekendType(d) ? state.weekendSlots : state.weekdaySlots;
}
function availableStaffFor(dKey, slotId) {
  const requested = new Set(
    Object.entries(state.allSubmissions)
      .filter(([, sub]) => {
        const e = sub[dKey];
        if (!e) return false;
        return (e.slots || []).includes(slotId);
      })
      .map(([name]) => name)
  );
  const all = state.staffDirectory.map((s) => ({ name: s.name, requested: requested.has(s.name) }));
  // 希望を出している人を先に、それ以外を後に
  all.sort((a, b) => (b.requested - a.requested) || a.name.localeCompare(b.name, "ja"));
  return all;
}
function wageOf(name, mKey) {
  const entry = state.staffDirectory.find((s) => s.name === name);
  if (!entry) return 0;
  const targetMKey = mKey || monthKey(state.cursor);
  if (Array.isArray(entry.wageHistory) && entry.wageHistory.length) {
    const applicable = entry.wageHistory.filter((h) => h.from <= targetMKey).sort((a, b) => a.from.localeCompare(b.from));
    if (applicable.length) return Number(applicable[applicable.length - 1].wage) || 0;
  }
  return Number(entry.wage) || 0;
}
function dailyCost(d) {
  const dKey = dateKey(d);
  const conf = state.confirmed[dKey] || {};
  const slots = slotsForDate(d);
  const mKey = monthKey(d);
  let total = 0;
  for (const s of slots) {
    const name = conf[s.id];
    if (name) total += slotHours(s) * wageOf(name, mKey);
  }
  return total;
}
function normalizeStaffDirectory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((item) =>
    typeof item === "string"
      ? { name: item, wage: 0, password: "", wageHistory: [] }
      : { name: item.name, wage: Number(item.wage) || 0, password: item.password || "", wageHistory: Array.isArray(item.wageHistory) ? item.wageHistory : [] }
  );
}

async function loadStaffDirectory() {
  const list = await apiGet(`staffList`);
  state.staffDirectory = normalizeStaffDirectory(list);
}

async function loadMonthData() {
  state.loading = true;
  render();
  const mKey = monthKey(state.cursor);
  const [cfg, slotsCfg, conf, staffList, subValues] = await Promise.all([
    apiGet(`config:${mKey}`),
    apiGet(`slotsConfig`),
    apiGet(`confirmed:${mKey}`),
    apiGet(`staffList`),
    apiListValues(`submission:${mKey}:`),
  ]);
  state.staffDirectory = normalizeStaffDirectory(staffList);
  let subs = {};
  for (const key in subValues) {
    const name = key.split(":").slice(2).join(":");
    subs[name] = subValues[key];
  }
  state.holidays = (cfg && cfg.holidays) || [];
  state.unlockedDates = (cfg && cfg.unlockedDates) || [];
  state.dateOverrides = (cfg && cfg.dateOverrides) || {};
  state.slotsSnapshot = (cfg && cfg.slotsSnapshot) || null;
  if (state.slotsSnapshot && state.slotsSnapshot.weekday && state.slotsSnapshot.weekday.length) {
    state.weekdaySlots = state.slotsSnapshot.weekday;
  } else {
    state.weekdaySlots = (slotsCfg && slotsCfg.weekday && slotsCfg.weekday.length) ? slotsCfg.weekday : DEFAULT_WEEKDAY_SLOTS;
  }
  if (state.slotsSnapshot && state.slotsSnapshot.weekend && state.slotsSnapshot.weekend.length) {
    state.weekendSlots = state.slotsSnapshot.weekend;
  } else {
    state.weekendSlots = (slotsCfg && slotsCfg.weekend && slotsCfg.weekend.length) ? slotsCfg.weekend : DEFAULT_WEEKEND_SLOTS;
  }
  state.confirmed = conf || {};
  state.allSubmissions = subs;
  state.mySubmission = state.staffName && subs[state.staffName] ? subs[state.staffName] : {};
  state.loading = false;
  render();
}

function timeLabel(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

async function loadMyRecord() {
  if (!state.staffName) return;
  state.myRecordLoading = true;
  state.myRecordError = false;
  render();

  try {
    const now = new Date();
    const mKey = monthKey(now);
    const [cfg, slotsCfg, conf] = await Promise.all([
      apiGet(`config:${mKey}`),
      apiGet(`slotsConfig`),
      apiGet(`confirmed:${mKey}`),
    ]);
    const holidays = (cfg && cfg.holidays) || [];
    const snap = cfg && cfg.slotsSnapshot;
    const weekdaySlotsM = (snap && snap.weekday && snap.weekday.length) ? snap.weekday : ((slotsCfg && slotsCfg.weekday && slotsCfg.weekday.length) ? slotsCfg.weekday : DEFAULT_WEEKDAY_SLOTS);
    const weekendSlotsM = (snap && snap.weekend && snap.weekend.length) ? snap.weekend : ((slotsCfg && slotsCfg.weekend && slotsCfg.weekend.length) ? slotsCfg.weekend : DEFAULT_WEEKEND_SLOTS);
    const confirmedM = conf || {};
    const myWage = wageOf(state.staffName);

    const dates = daysInMonth(now.getFullYear(), now.getMonth());
    const rows = [];
    let hoursTotal = 0, lateCount = 0;

    const punchValues = await apiListValues(`punch:${mKey}`);
    const recordsByDate = {};
    for (const key in punchValues) {
      const parts = key.split(":");
      if (parts.length < 3) continue;
      const dStr = parts[1];
      const name = parts.slice(2).join(":");
      if (name === state.staffName) recordsByDate[dStr] = punchValues[key];
    }

    for (const d of dates) {
      if (d > now) continue;
      const dKey = dateKey(d);
      const records = recordsByDate[dKey];
      if (!records || !records.length) continue;

      const hours = calcHoursForPunches(records);
      hoursTotal += hours;

      const dow = d.getDay();
      const weekend = dow === 0 || dow === 6 || holidays.includes(dKey);
      const slots = weekend ? weekendSlotsM : weekdaySlotsM;
      const dayConf = confirmedM[dKey] || {};
      let scheduledStartMin = null;
      for (const s of slots) {
        if (dayConf[s.id] === state.staffName) {
          const sm = hmToMinutes(s.start);
          if (scheduledStartMin === null || sm < scheduledStartMin) scheduledStartMin = sm;
        }
      }
      const inTime = firstInTime(records);
      let isLate = false, lateMinutes = 0;
      if (scheduledStartMin !== null && inTime) {
        const actualMin = inTime.getHours() * 60 + inTime.getMinutes();
        lateMinutes = actualMin - scheduledStartMin;
        isLate = lateMinutes > CONFIG.LATE_GRACE_MINUTES;
      }
      if (isLate) lateCount++;

      const inRecs = records.filter((r) => r.type === "in").sort((a, b) => new Date(a.time) - new Date(b.time));
      const outRecs = records.filter((r) => r.type === "out").sort((a, b) => new Date(a.time) - new Date(b.time));
      const inRec = inRecs.length ? inRecs[0] : null;
      const outRec = outRecs.length ? outRecs[outRecs.length - 1] : null;

      rows.push({
        date: d,
        dKey,
        hours,
        inLabel: inRec ? timeLabel(new Date(inRec.time)) : "-",
        outLabel: outRec ? timeLabel(new Date(outRec.time)) : "-",
        isLate,
        lateMinutes,
      });
    }

    state.myRecord = { rows, hoursTotal, wageTotal: hoursTotal * myWage, lateCount, monthLabel: `${now.getFullYear()}年${now.getMonth() + 1}月` };
  } catch (err) {
    console.error("loadMyRecord failed", err);
    state.myRecordError = true;
  } finally {
    state.myRecordLoading = false;
    render();
  }
}

async function submitResetCode() {
  const codeInput = document.getElementById("resetCodeInput");
  const pw1 = document.getElementById("resetNewPassword");
  const pw2 = document.getElementById("resetNewPassword2");
  const code = codeInput ? codeInput.value.trim() : "";
  if (!pw1.value || pw1.value !== pw2.value) {
    state.forgotFlash = "新しいパスワードが一致しません";
    render();
    return;
  }
  state.saving = true; render();
  const result = await apiAction({ action: "resetAdminPassword", code, newPassword: pw1.value });
  state.saving = false;
  if (result && result.ok) {
    state.adminPasswordValue = pw1.value;
    state.showForgotPassword = false;
    state.forgotStep = "request";
    state.forgotFlash = "";
    flash("パスワードを再設定しました。新しいパスワードでログインしてください");
    render();
  } else {
    const map = { bad_code: "コードが正しくありません", expired: "コードの有効期限が切れています", no_code: "先にコードを送信してください" };
    state.forgotFlash = (result && map[result.error]) || "再設定に失敗しました";
    render();
  }

    const weekend = isWeekendType(d);
    const conf = state.confirmed[dKey] || {};
    const deadlinePassed = isLocked(d);
    const unlocked = state.unlockedDates.includes(dKey);
    const hasOverride = !!(state.dateOverrides[dKey] && state.dateOverrides[dKey].length);
    html += `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">
        <div>${dateLabelHtml(d, weekend)}${hasOverride ? ` <span class="badge" style="background:var(--orange-bg);color:var(--orange)">時間変更中</span>` : ""}</div>
        <button class="text-link" data-action="openDateSlotEditor" data-date="${dKey}">🕐 この日だけ時間を変更</button>
      </div>`;
    if (deadlinePassed) {
      html += `<button class="holiday-chip ${unlocked ? "active" : ""}" data-action="toggleUnlock" data-date="${dKey}" style="margin:8px 0 0">
        ${unlocked ? "🔓 受付延長中（クリックで締切に戻す）" : "🔒 締切済み（クリックで受付を再開）"}
      </button>`;
    }
    if (state.editingDateSlots === dKey) {
      let rows = "";
      for (const s of state.editingSlotsList) {
        rows += `<div class="slot-editor-row">
          <input type="text" value="${esc(s.label)}" data-action="overrideSlotLabel" data-id="${s.id}" placeholder="枠の名前" />
          <input type="time" value="${s.start}" data-action="overrideSlotStart" data-id="${s.id}" />
          〜
          <input type="time" value="${s.end}" data-action="overrideSlotEnd" data-id="${s.id}" />
          <button class="remove-btn" data-action="removeOverrideSlot" data-id="${s.id}">削除</button>
        </div>`;
      }
      html += `<div class="card" style="background:#FBF8F2;margin-top:12px">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">🕐 ${d.getMonth() + 1}/${d.getDate()}だけの時間設定</div>
        ${rows}
        <button class="add-btn" data-action="addOverrideSlot">＋ 枠を追加</button>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="submit-btn" style="margin-top:0;flex:1" data-action="saveDateSlotOverride">保存する</button>
          ${hasOverride ? `<button class="remove-btn" data-action="resetDateSlotOverride" data-date="${dKey}">通常の時間に戻す</button>` : ""}
          <button class="remove-btn" data-action="closeDateSlotEditor">キャンセル</button>
        </div>
      </div>`;
    }
    html += `<div style="margin-top:12px">`;
    for (const s of slotsForDate(d)) {
      html += assignRowHtml(`${s.label}（${s.start}〜${s.end}）`, conf[s.id] || "", availableStaffFor(dKey, s.id), dKey, s.id);
    }
    const cost = dailyCost(d);
    if (cost > 0) html += `<div class="cost-total">💰 この日の人件費：${fmtYen(cost)}</div>`;
    html += `</div></div>`;
  }
  html += `</div>
    <button class="save-btn" data-action="saveConfirmed">🔒 シフトを確定して保存</button>`;
  return html;
}

function assignRowHtml(label, value, options, dKey, field) {
  let opts = `<option value="">未定</option>`;
  for (const o of options) {
    const optLabel = o.requested ? `${o.name}（○希望あり）` : `${o.name}（希望なし）`;
    opts += `<option value="${esc(o.name)}" ${value === o.name ? "selected" : ""}>${esc(optLabel)}</option>`;
  }
  return `<div class="assign-row">
    <span class="assign-label">${esc(label)}</span>
    <select data-action="assign" data-date="${dKey}" data-field="${field}">${opts}</select>
  </div>`;
}

function renderMyRecordTab() {
  if (state.myRecordLoading) {
    return `<div class="center-msg">読み込み中…</div>`;
  }
  if (state.myRecordError || !state.myRecord) {
    return `<div class="center-msg">
      <p>読み込みに失敗しました</p>
      <button class="submit-btn" style="margin-top:12px" data-action="retryMyRecord">再読み込み</button>
    </div>`;
  }
  const rec = state.myRecord;
  let rows = "";
  for (const r of rec.rows) {
    const dow = r.date.getDay();
    rows += `<tr>
      <td>${r.date.getDate()}日(${WEEKDAY_JP[dow]})</td>
      <td>${r.inLabel}</td>
      <td>${r.outLabel}</td>
      <td>${r.hours.toFixed(1)}h</td>
      <td>${r.isLate ? `<span style="color:var(--rose);font-weight:700">遅刻 ${r.lateMinutes}分</span>` : ""}</td>
    </tr>`;
  }
  return `
    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">${esc(rec.monthLabel)}の記録（${esc(state.staffName)}）</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div><div style="font-size:11px;color:var(--muted)">労働時間</div><div style="font-size:20px;font-weight:700">${rec.hoursTotal.toFixed(1)}h</div></div>
        <div><div style="font-size:11px;color:var(--muted)">現状の給与見込み</div><div style="font-size:20px;font-weight:700">${fmtYen(rec.wageTotal)}</div></div>
        <div><div style="font-size:11px;color:var(--muted)">遅刻回数</div><div style="font-size:20px;font-weight:700">${rec.lateCount}回</div></div>
      </div>
      <p style="font-size:11px;color:var(--muted2);margin-top:8px">給与見込みは、今月これまでの打刻から計算した時給ベースの概算です。実際の支給額とは異なる場合があります。</p>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">打刻履歴</div>
      <table>
        <thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>時間</th><th>備考</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" style="text-align:center;color:var(--muted2)">この月の打刻記録はまだありません</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function renderReportTab() {
  const dates = daysInMonth(state.cursor.getFullYear(), state.cursor.getMonth());
  let rows = "";
  let monthTotal = 0;
  for (const d of dates) {
    const dKey = dateKey(d);
    const weekend = isWeekendType(d);
    const conf = state.confirmed[dKey] || {};
    const slots = slotsForDate(d);
    const assignedAny = slots.some((s) => conf[s.id]);
    const cost = dailyCost(d);
    monthTotal += cost;
    let cell = "";
    if (!assignedAny) cell = `<span style="color:var(--rose)">未確定</span>`;
    else cell = slots.filter((s) => conf[s.id]).map((s) => `<div>${esc(s.label)}（${s.start}〜${s.end}）：${esc(conf[s.id])}</div>`).join("");
    rows += `<tr><td>${dateLabelHtml(d, weekend)}</td><td>${cell}</td><td>${cost > 0 ? fmtYen(cost) : ""}</td></tr>`;
  }
  return `<div class="card">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">👥 確定シフト一覧</div>
    <table><thead><tr><th>日付</th><th>担当</th><th>人件費</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="grand-total">今月の人件費合計：${fmtYen(monthTotal)}</div>
  </div>`;
}

function renderStaffLoginGate() {
  let options = `<option value="">選択してください</option>`;
  for (const s of state.staffDirectory) options += `<option value="${esc(s.name)}">${esc(s.name)}</option>`;
  return `
    <header><div class="wrap header-row">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo-badge">📅</div>
        <div><h1 class="disp">シフト管理板<span class="tag">シフト提出</span></h1></div>
      </div>
    </div></header>
    <div class="wrap" style="padding-top:60px;max-width:360px">
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔑 スタッフログイン</div>
        <label class="field-label">お名前</label>
        <select id="staffLoginName">${options}</select>
        <label class="field-label" style="margin-top:8px">パスワード</label>
        <input type="password" id="staffLoginPassword" />
        <button class="submit-btn" style="width:100%;justify-content:center;margin-top:12px" data-action="staffLogin">ログイン</button>
        ${state.flash ? `<div class="flash" style="margin-top:8px">${esc(state.flash)}</div>` : ""}
        <p style="font-size:11px;color:var(--muted2);margin-top:12px">ID・パスワードが分からない場合は管理者にご確認ください。</p>
      </div>
    </div>
  `;
}

function render() {
  const root = document.getElementById("root");

  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf("YOUR_APPS_SCRIPT") === 0) {
    root.innerHTML = `<div class="center-msg">
      <div style="font-size:32px">⚠</div>
      <p style="font-weight:700;margin-top:8px">API_URLが設定されていません</p>
      <p style="font-size:14px;margin-top:8px">このファイル内の <code>CONFIG.API_URL</code> に、Google Apps Scriptで発行したウェブアプリのURLを貼り付けてください。</p>
    </div>`;
    return;
  }

  if (state.route === "admin" && !state.adminAuthed) {
    if (state.showForgotPassword) {
      root.innerHTML = `
        <header><div class="wrap header-row">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="logo-badge">📅</div>
            <div><h1 class="disp">シフト管理板<span class="tag">シフト管理</span></h1></div>
          </div>
        </div></header>
        <div class="wrap" style="padding-top:60px;max-width:360px">
          <div class="card">
            <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔑 パスワードの再設定</div>
            ${state.forgotStep === "request" ? `
              <p style="font-size:13px;color:var(--muted)">登録済みのメールアドレスに再設定コードを送信します。</p>
              <button class="submit-btn" style="width:100%;justify-content:center" data-action="requestResetCode" ${state.saving ? "disabled" : ""}>${state.saving ? "送信中…" : "コードを送信する"}</button>
            ` : `
              <label class="field-label">メールに届いたコード</label>
              <input type="text" id="resetCodeInput" placeholder="6桁のコード" />
              <label class="field-label" style="margin-top:8px">新しいパスワード</label>
              <input type="password" id="resetNewPassword" />
              <label class="field-label" style="margin-top:8px">新しいパスワード（確認）</label>
              <input type="password" id="resetNewPassword2" />
              <button class="submit-btn" style="width:100%;justify-content:center" data-action="submitResetCode" ${state.saving ? "disabled" : ""}>${state.saving ? "処理中…" : "パスワードを再設定する"}</button>
            `}
            ${state.forgotFlash ? `<div class="flash" style="margin-top:8px">${esc(state.forgotFlash)}</div>` : ""}
            <button class="text-link" style="margin-top:12px" data-action="backToLogin">ログイン画面に戻る</button>
          </div>
        </div>
      `;
      return;
    }
    root.innerHTML = `
      <header><div class="wrap header-row">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="logo-badge">📅</div>
          <div><h1 class="disp">シフト管理板<span class="tag">シフト管理</span></h1></div>
        </div>
      </div></header>
      <div class="wrap" style="padding-top:60px;max-width:360px">
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔒 管理者パスワード</div>
          <input type="password" id="adminPasswordInput" placeholder="パスワードを入力" />
          <button class="submit-btn" style="width:100%;justify-content:center;margin-top:12px" data-action="adminLogin">入る</button>
          ${state.flash ? `<div class="flash" style="margin-top:8px">${esc(state.flash)}</div>` : ""}
          <button class="text-link" style="margin-top:12px" data-action="showForgotPassword">パスワードを忘れた場合はこちら</button>
        </div>
      </div>
    `;
    const pw = document.getElementById("adminPasswordInput");
    if (pw) {
      pw.focus();
      pw.addEventListener("keydown", (e) => { if (e.key === "Enter") adminLogin(); });
    }
    return;
  }

  if (state.route === "staff" && !state.staffAuthed) {
    if (state.loading) {
      root.innerHTML = `<div class="center-msg">読み込み中…</div>`;
      return;
    }
    root.innerHTML = renderStaffLoginGate();
    const pw = document.getElementById("staffLoginPassword");
    if (pw) pw.addEventListener("keydown", (e) => { if (e.key === "Enter") staffLogin(); });
    return;
  }

  const tabs = state.route === "admin"
    ? [{ id: "admin", label: "🔒 シフト確定" }, { id: "report", label: "📋 確定シフト表" }]
    : [{ id: "input", label: "📨 希望シフト入力" }, { id: "report", label: "📋 確定シフト表" }, { id: "myrecord", label: "🕐 自分の記録" }];

  let body;
  if (state.loading) {
    body = `<div class="center-msg">読み込み中…</div>`;
  } else if (state.tab === "input") {
    body = renderInputTab();
  } else if (state.tab === "admin") {
    body = renderAdminTab();
  } else if (state.tab === "myrecord") {
    body = renderMyRecordTab();
  } else {
    body = renderReportTab();
  }

  root.innerHTML = `
    <header><div class="wrap header-row">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo-badge">📅</div>
        <div>
          <h1 class="disp">シフト管理板<span class="tag">${state.route === "admin" ? "シフト管理" : "シフト提出"}</span></h1>
          <p class="sub">平日ワンオペ・土日祝二部制</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        ${(state.saving || state.flash) ? `<div class="flash">${state.saving ? "保存中…" : esc(state.flash)}</div>` : ""}
        ${state.route === "admin" ? `<a class="switch-link" href="#staff">スタッフ画面へ</a>` : ""}
      </div>
    </div></header>
    <div class="wrap">
      <div class="month-nav">
        <button data-action="prevMonth">‹</button>
        <div class="month-label disp">${state.cursor.getFullYear()}年 ${state.cursor.getMonth() + 1}月</div>
        <button data-action="nextMonth">›</button>
      </div>
      <div class="tabs">
        ${tabs.map((t) => `<button class="tab-btn ${state.tab === t.id ? "active" : ""}" data-action="setTab" data-tab="${t.id}">${t.label}</button>`).join("")}
      </div>
      ${body}
    </div>
    <div class="footer-note">入力・確定内容はスタッフ全員が閲覧できる共有データ（Googleスプレッドシート）として保存されます。</div>
  `;
}

// ---- event delegation ----
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "prevMonth") changeMonth(-1);
  else if (action === "nextMonth") changeMonth(1);
  else if (action === "setTab") {
    state.tab = el.dataset.tab;
    render();
    if (state.tab === "myrecord" && !state.myRecord && !state.myRecordLoading) loadMyRecord();
  }
  else if (action === "retryMyRecord") loadMyRecord();
  else if (action === "toggleSlot") toggleSlot(el.dataset.date, el.dataset.slot);
  else if (action === "submit") submitMyShift();
  else if (action === "toggleHoliday") toggleHoliday(el.dataset.date);
  else if (action === "toggleUnlock") toggleUnlock(el.dataset.date);
  else if (action === "openDateSlotEditor") openDateSlotEditor(el.dataset.date);
  else if (action === "closeDateSlotEditor") closeDateSlotEditor();
  else if (action === "addOverrideSlot") addOverrideSlot();
  else if (action === "removeOverrideSlot") removeOverrideSlot(el.dataset.id);
  else if (action === "saveDateSlotOverride") saveDateSlotOverride();
  else if (action === "resetDateSlotOverride") resetDateSlotOverride(el.dataset.date);
  else if (action === "saveConfirmed") saveConfirmed();
  else if (action === "adminLogin") adminLogin();
  else if (action === "showForgotPassword") { state.showForgotPassword = true; state.forgotStep = "request"; state.forgotFlash = ""; render(); }
  else if (action === "backToLogin") { state.showForgotPassword = false; state.forgotFlash = ""; render(); }
  else if (action === "requestResetCode") requestResetCode();
  else if (action === "submitResetCode") submitResetCode();
  else if (action === "toggleAdminPasswordChange") { state.showAdminPasswordChange = !state.showAdminPasswordChange; render(); }
  else if (action === "changeAdminPassword") changeAdminPassword();
  else if (action === "addSlot") addSlot(el.dataset.type);
  else if (action === "removeSlot") removeSlot(el.dataset.type, el.dataset.id);
  else if (action === "saveSlotsConfig") saveSlotsConfig();
  else if (action === "addStaff") addStaff();
  else if (action === "removeStaff") removeStaff(el.dataset.name);
  else if (action === "saveStaffDirectory") saveStaffDirectory();
  else if (action === "staffLogin") staffLogin();
  else if (action === "staffLogout") staffLogout();
  else if (action === "togglePasswordChange") { state.showPasswordChange = !state.showPasswordChange; render(); }
  else if (action === "changeMyPassword") changeMyPassword();
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "assign") assign(el.dataset.date, el.dataset.field, el.value);
  else if (action === "slotLabel") updateSlotField(el.dataset.type, el.dataset.id, "label", el.value);
  else if (action === "slotStart") updateSlotField(el.dataset.type, el.dataset.id, "start", el.value);
  else if (action === "slotEnd") updateSlotField(el.dataset.type, el.dataset.id, "end", el.value);
  else if (action === "overrideSlotLabel") updateOverrideSlotField(el.dataset.id, "label", el.value);
  else if (action === "overrideSlotStart") updateOverrideSlotField(el.dataset.id, "start", el.value);
  else if (action === "overrideSlotEnd") updateOverrideSlotField(el.dataset.id, "end", el.value);
  else if (action === "staffName") updateStaffField(Number(el.dataset.index), "name", el.value);
  else if (action === "staffWage") updateStaffField(Number(el.dataset.index), "wage", el.value);
  else if (action === "staffPassword") updateStaffField(Number(el.dataset.index), "password", el.value);
});
window.addEventListener("hashchange", () => {
  state.route = readRoute();
  state.tab = state.route === "admin" ? "admin" : "input";
  render();
});

// ---- boot ----
(async function init() {
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf("YOUR_APPS_SCRIPT") === 0) { render(); return; }
  state.loading = true;
  render();
  const storedPw = await apiGet("adminPassword");
  state.adminPasswordValue = storedPw != null ? storedPw : null;
  await loadStaffDirectory();
  if (state.route === "admin") {
    if (state.adminAuthed) { loadMonthData(); } else { state.loading = false; render(); }
  } else {
    if (state.staffAuthed && state.staffDirectory.find((s) => s.name === state.staffName)) {
      loadMonthData();
      loadMyRecord();
    } else {
      state.staffAuthed = false;
      state.loading = false;
      render();
    }
  }
})();
</script>
</body>
</html>
