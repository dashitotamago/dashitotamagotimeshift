<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>シフト管理板</title>
<style>
  :root {
    --bg: #F6F3EC;
    --ink: #22282F;
    --border: #DED7C6;
    --green: #2F6F4E;
    --orange: #B5541E;
    --orange-bg: #FBE9D6;
    --rose: #C1666B;
    --rose-bg: #F3E3E3;
    --muted: #7A756A;
    --muted2: #9A968C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }
  .disp { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; }
  header { background: var(--ink); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .logo-badge {
    width: 36px; height: 36px; border-radius: 4px; background: var(--orange);
    display: flex; align-items: center; justify-content: center; color: #F6F3EC; font-size: 18px;
  }
  h1 { margin: 0; font-size: 20px; color: #F6F3EC; }
  h1 .tag { font-size: 12px; font-weight: 400; margin-left: 8px; color: #E0A458; }
  .sub { margin: 2px 0 0; font-size: 12px; color: #B8B2A2; }
  .flash { font-size: 12px; color: #E0A458; }
  .switch-link { font-size: 12px; color: #B8B2A2; text-decoration: underline; cursor: pointer; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .month-nav button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px 14px; border-radius: 999px; }
  .month-nav button:hover { background: rgba(0,0,0,0.05); }
  .month-label { font-size: 18px; font-weight: 700; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
    padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--green); border-color: var(--green); }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .card + .card { margin-top: 12px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .date-label { display: flex; align-items: baseline; gap: 6px; }
  .date-num { font-weight: 700; font-size: 14px; }
  .date-dow { font-size: 12px; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 999px; margin-left: 4px; }
  .badge-weekend { background: var(--orange-bg); color: var(--orange); }
  .badge-locked { background: var(--rose-bg); color: var(--rose); display: inline-flex; align-items: center; gap: 3px; }
  .slot-btn {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
    border-radius: 4px; font-size: 14px; border: 1px solid var(--border); color: var(--muted);
    background: #fff; cursor: pointer; margin-top: 8px; width: 100%;
  }
  .slot-btn:first-of-type { margin-top: 12px; }
  .slot-btn.checked { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
  input[type=text], input[type=number], input[type=password], input[type=time] {
    width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; font-size: 14px;
  }
  label.field-label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
  .submit-btn, .save-btn, .add-btn {
    margin-top: 20px; display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px;
    border-radius: 4px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; color: #fff;
  }
  .submit-btn { background: var(--green); }
  .save-btn { background: var(--ink); }
  .add-btn { background: var(--orange); padding: 8px 14px; font-size: 13px; margin-top: 8px; }
  .holiday-chip {
    font-size: 12px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);
    color: var(--muted2); background: #fff; cursor: pointer; margin: 2px;
  }
  .holiday-chip.active { background: var(--orange); border-color: var(--orange); color: #fff; }
  .assign-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .assign-row:first-child { margin-top: 0; }
  .assign-label { font-size: 12px; color: var(--muted); width: 130px; flex-shrink: 0; }
  select { flex: 1; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; font-size: 14px; }
  table { width: 100%; font-size: 14px; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px 6px 0; }
  td { padding: 8px 8px 8px 0; border-top: 1px solid #EFEAE0; vertical-align: top; }
  .footer-note { max-width: 900px; margin: 0 auto; padding: 8px 20px 40px; font-size: 12px; color: var(--muted2); }
  .center-msg { text-align: center; padding: 100px 20px; color: var(--muted); }
  .slot-editor-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .slot-editor-row input[type=text] { flex: 1; min-width: 100px; }
  .slot-editor-row input[type=time] { width: 110px; }
  .remove-btn {
    background: none; border: 1px solid var(--rose); color: var(--rose); border-radius: 4px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .staff-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .staff-row input[type=text], .staff-row input[type=number] { flex: 1; min-width: 90px; }
  .section-title { font-size: 13px; font-weight: 700; margin: 16px 0 4px; color: var(--muted); }
  .section-title:first-child { margin-top: 0; }
  .cost-total { font-size: 13px; color: var(--green); font-weight: 700; margin-top: 4px; }
  .grand-total { font-size: 16px; font-weight: 700; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .welcome-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .text-link { color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; font-size: 12px; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ==== ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください ====
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbxwfYOVj6sYN9loitbwkOX5h0bJRCzz6uoyXVVk7QWQrbjmPP__QU1H0C1Y0LpMHNV3/exec",
  ADMIN_PASSWORD: "0310",
};

const WEEKDAY_JP = ["日", "月", "火", "水", "木", "金", "土"];
const DEFAULT_WEEKDAY_SLOTS = [{ id: "w1", label: "ワンオペ", start: "09:00", end: "18:00" }];
const DEFAULT_WEEKEND_SLOTS = [
  { id: "s1", label: "10:00〜15:00", start: "10:00", end: "15:00" },
  { id: "s2", label: "11:30〜16:30", start: "11:30", end: "16:30" },
];

function monthKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function daysInMonth(year, month) {
  const arr = [];
  const d = new Date(year, month, 1);
  while (d.getMonth() === month) { arr.push(new Date(d)); d.setDate(d.getDate() + 1); }
  return arr;
}
function periodInfoFor(d) {
  const day = d.getDate(), y = d.getFullYear(), m = d.getMonth();
  if (day <= 15) {
    const deadline = new Date(y, m - 1, 20, 23, 59, 59);
    return { deadline, label: `${deadline.getMonth() + 1}/${deadline.getDate()}` };
  }
  const deadline = new Date(y, m, 5, 23, 59, 59);
  return { deadline, label: `${deadline.getMonth() + 1}/${deadline.getDate()}` };
}
function isLocked(d) { return new Date() > periodInfoFor(d).deadline; }
function effectiveLocked(d) {
  if (state.unlockedDates.includes(dateKey(d))) return false;
  return isLocked(d);
}
function readRoute() { return window.location.hash.replace("#", "").toLowerCase() === "admin" ? "admin" : "staff"; }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid() { return "slot_" + Math.random().toString(36).slice(2, 9); }
function hmToMinutes(hm) {
  const [h, m] = String(hm).split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}
function slotHours(slot) {
  let mins = hmToMinutes(slot.end) - hmToMinutes(slot.start);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}
function fmtYen(n) { return "¥" + Math.round(n).toLocaleString("ja-JP"); }

async function apiGet(key) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data || data.value == null || data.value === "") return null;
    return JSON.parse(data.value);
  } catch (e) { console.error("apiGet failed", key, e); return null; }
}
async function apiSet(key, value) {
  try {
    await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", key, value: JSON.stringify(value) }),
    });
    return true;
  } catch (e) { console.error("apiSet failed", key, e); return false; }
}
async function apiList(prefix) {
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    return (data && data.keys) || [];
  } catch (e) { console.error("apiList failed", prefix, e); return []; }
}

// ---- app state ----
const state = {
  cursor: (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })(),
  route: readRoute(),
  tab: readRoute() === "admin" ? "admin" : "input",
  loading: true,
  saving: false,
  flash: "",
  adminAuthed: sessionStorage.getItem("adminAuthed") === "1",
  staffAuthed: sessionStorage.getItem("staffAuthed") === "1",
  staffName: sessionStorage.getItem("staffAuthedName") || "",
  showPasswordChange: false,
  holidays: [],
  unlockedDates: [],
  weekdaySlots: DEFAULT_WEEKDAY_SLOTS,
  weekendSlots: DEFAULT_WEEKEND_SLOTS,
  mySubmission: {},
  allSubmissions: {},
  staffDirectory: [], // [{name, wage, password}]
  confirmed: {},
};

function isWeekendType(d) {
  const dow = d.getDay();
  return dow === 0 || dow === 6 || state.holidays.includes(dateKey(d));
}
function slotsForDate(d) { return isWeekendType(d) ? state.weekendSlots : state.weekdaySlots; }
function availableStaffFor(dKey, slotId) {
  return Object.entries(state.allSubmissions)
    .filter(([, sub]) => {
      const e = sub[dKey];
      if (!e) return false;
      return (e.slots || []).includes(slotId);
    })
    .map(([name]) => name);
}
function wageOf(name) {
  const entry = state.staffDirectory.find((s) => s.name === name);
  return entry ? Number(entry.wage) || 0 : 0;
}
function dailyCost(d) {
  const dKey = dateKey(d);
  const conf = state.confirmed[dKey] || {};
  const slots = slotsForDate(d);
  let total = 0;
  for (const s of slots) {
    const name = conf[s.id];
    if (name) total += slotHours(s) * wageOf(name);
  }
  return total;
}
function normalizeStaffDirectory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((item) =>
    typeof item === "string"
      ? { name: item, wage: 0, password: "" }
      : { name: item.name, wage: Number(item.wage) || 0, password: item.password || "" }
  );
}

async function loadStaffDirectory() {
  const list = await apiGet(`staffList`);
  state.staffDirectory = normalizeStaffDirectory(list);
}

async function loadMonthData() {
  state.loading = true;
  render();
  const mKey = monthKey(state.cursor);
  const cfg = await apiGet(`config:${mKey}`);
  const slotsCfg = await apiGet(`slotsConfig`);
  const conf = await apiGet(`confirmed:${mKey}`);
  await loadStaffDirectory();
  let subs = {};
  const keys = await apiList(`submission:${mKey}:`);
  for (const k of keys) {
    const name = k.split(":").slice(2).join(":");
    const val = await apiGet(k);
    if (val) subs[name] = val;
  }
  state.holidays = (cfg && cfg.holidays) || [];
  state.unlockedDates = (cfg && cfg.unlockedDates) || [];
  state.weekdaySlots = (slotsCfg && slotsCfg.weekday && slotsCfg.weekday.length) ? slotsCfg.weekday : DEFAULT_WEEKDAY_SLOTS;
  state.weekendSlots = (slotsCfg && slotsCfg.weekend && slotsCfg.weekend.length) ? slotsCfg.weekend : DEFAULT_WEEKEND_SLOTS;
  state.confirmed = conf || {};
  state.allSubmissions = subs;
  state.mySubmission = state.staffName && subs[state.staffName] ? subs[state.staffName] : {};
  state.loading = false;
  render();
}

function flash(msg) {
  state.flash = msg;
  render();
  setTimeout(() => { state.flash = ""; render(); }, 1800);
}

async function saveDateConfig() {
  await apiSet(`config:${monthKey(state.cursor)}`, { holidays: state.holidays, unlockedDates: state.unlockedDates });
}
async function toggleHoliday(dKey) {
  state.holidays = state.holidays.includes(dKey) ? state.holidays.filter((h) => h !== dKey) : [...state.holidays, dKey];
  render();
  state.saving = true; render();
  await saveDateConfig();
  state.saving = false;
  flash("設定を保存しました");
}
async function toggleUnlock(dKey) {
  state.unlockedDates = state.unlockedDates.includes(dKey) ? state.unlockedDates.filter((h) => h !== dKey) : [...state.unlockedDates, dKey];
  render();
  state.saving = true; render();
  await saveDateConfig();
  state.saving = false;
  flash(state.unlockedDates.includes(dKey) ? "受付を再開しました" : "締切ロックに戻しました");
}

function toggleSlot(dKey, slotId) {
  const cur = (state.mySubmission[dKey] && state.mySubmission[dKey].slots) || [];
  const next = cur.includes(slotId) ? cur.filter((s) => s !== slotId) : [...cur, slotId];
  state.mySubmission = { ...state.mySubmission, [dKey]: { slots: next } };
  render();
}

async function submitMyShift() {
  state.saving = true; render();
  const mKey = monthKey(state.cursor);
  await apiSet(`submission:${mKey}:${state.staffName}`, state.mySubmission);
  state.allSubmissions = { ...state.allSubmissions, [state.staffName]: state.mySubmission };
  state.saving = false;
  flash("希望シフトを送信しました");
}

function assign(dKey, field, name) {
  state.confirmed = { ...state.confirmed, [dKey]: { ...state.confirmed[dKey], [field]: name || undefined } };
  render();
}
async function saveConfirmed() {
  state.saving = true; render();
  await apiSet(`confirmed:${monthKey(state.cursor)}`, state.confirmed);
  state.saving = false;
  flash("確定シフトを保存しました");
}

// ---- slot (shift time / headcount) editing ----
async function saveSlotsConfig() {
  state.saving = true; render();
  await apiSet(`slotsConfig`, { weekday: state.weekdaySlots, weekend: state.weekendSlots });
  state.saving = false;
  flash("シフト枠を保存しました");
}
function addSlot(type) {
  const list = type === "weekday" ? state.weekdaySlots : state.weekendSlots;
  const newSlot = { id: uid(), label: "新しい枠", start: "09:00", end: "13:00" };
  if (type === "weekday") state.weekdaySlots = [...list, newSlot];
  else state.weekendSlots = [...list, newSlot];
  render();
}
function removeSlot(type, id) {
  if (type === "weekday") state.weekdaySlots = state.weekdaySlots.filter((s) => s.id !== id);
  else state.weekendSlots = state.weekendSlots.filter((s) => s.id !== id);
  render();
}
function updateSlotField(type, id, field, value) {
  const apply = (list) => list.map((s) => (s.id === id ? { ...s, [field]: value } : s));
  if (type === "weekday") state.weekdaySlots = apply(state.weekdaySlots);
  else state.weekendSlots = apply(state.weekendSlots);
}

// ---- staff account management (admin) ----
async function saveStaffDirectory() {
  state.saving = true; render();
  await apiSet(`staffList`, state.staffDirectory);
  state.saving = false;
  flash("スタッフ情報を保存しました");
}
function addStaff() {
  state.staffDirectory = [...state.staffDirectory, { name: "", wage: 0, password: "" }];
  render();
}
function removeStaff(name) {
  state.staffDirectory = state.staffDirectory.filter((s) => s.name !== name);
  render();
}
function updateStaffField(index, field, value) {
  state.staffDirectory = state.staffDirectory.map((s, i) => (i === index ? { ...s, [field]: value } : s));
}

// ---- staff login (ID = name, password) ----
async function staffLogin() {
  const nameSel = document.getElementById("staffLoginName");
  const pwInput = document.getElementById("staffLoginPassword");
  const name = nameSel ? nameSel.value : "";
  const pw = pwInput ? pwInput.value : "";
  if (!name) { flash("お名前を選択してください"); return; }
  const entry = state.staffDirectory.find((s) => s.name === name);
  if (!entry || entry.password !== pw) {
    flash("名前またはパスワードが違います");
    return;
  }
  state.staffAuthed = true;
  state.staffName = name;
  sessionStorage.setItem("staffAuthed", "1");
  sessionStorage.setItem("staffAuthedName", name);
  loadMonthData();
}
function staffLogout() {
  state.staffAuthed = false;
  state.staffName = "";
  sessionStorage.removeItem("staffAuthed");
  sessionStorage.removeItem("staffAuthedName");
  render();
}
async function changeMyPassword() {
  const cur = document.getElementById("curPasswordInput");
  const next1 = document.getElementById("newPasswordInput");
  const next2 = document.getElementById("newPasswordInput2");
  const entry = state.staffDirectory.find((s) => s.name === state.staffName);
  if (!entry || (cur ? cur.value : "") !== entry.password) { flash("現在のパスワードが違います"); return; }
  if (!next1.value || next1.value !== next2.value) { flash("新しいパスワードが一致しません"); return; }
  state.staffDirectory = state.staffDirectory.map((s) => (s.name === state.staffName ? { ...s, password: next1.value } : s));
  state.saving = true; render();
  await apiSet(`staffList`, state.staffDirectory);
  state.saving = false;
  state.showPasswordChange = false;
  flash("パスワードを変更しました");
}

function changeMonth(delta) {
  state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + delta, 1);
  loadMonthData();
}

async function adminLogin() {
  const input = document.getElementById("adminPasswordInput");
  const value = input ? input.value : "";
  if (value === CONFIG.ADMIN_PASSWORD) {
    state.adminAuthed = true;
    sessionStorage.setItem("adminAuthed", "1");
    await loadStaffDirectory();
    loadMonthData();
  } else {
    flash("パスワードが違います");
  }
}

// ---- rendering ----
function dateLabelHtml(d, weekend) {
  const dow = d.getDay();
  const color = dow === 0 ? "var(--rose)" : dow === 6 ? "var(--green)" : "var(--ink)";
  return `<div class="date-label">
    <span class="date-num" style="color:${color}">${d.getDate()}日</span>
    <span class="date-dow" style="color:${color}">(${WEEKDAY_JP[dow]})</span>
    ${weekend ? `<span class="badge badge-weekend">土日祝</span>` : ""}
  </div>`;
}

function renderInputTab() {
  const dates = daysInMonth(state.cursor.getFullYear(), state.cursor.getMonth());
  const periodA = dates.find((d) => d.getDate() === 1);
  const periodB = dates.find((d) => d.getDate() === 16) || dates.find((d) => d.getDate() === 15);
  const infoA = periodA && periodInfoFor(periodA);
  const infoB = periodB && periodInfoFor(periodB);

  let html = `<div class="welcome-row">
    <span>ようこそ、${esc(state.staffName)} さん</span>
    <span>
      <button class="text-link" data-action="togglePasswordChange">パスワードを変更</button>
      ・
      <button class="text-link" data-action="staffLogout">ログアウト</button>
    </span>
  </div>`;

  if (state.showPasswordChange) {
    html += `<div class="card" style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">🔑 パスワード変更</div>
      <label class="field-label">現在のパスワード</label>
      <input type="password" id="curPasswordInput" />
      <label class="field-label" style="margin-top:8px">新しいパスワード</label>
      <input type="password" id="newPasswordInput" />
      <label class="field-label" style="margin-top:8px">新しいパスワード（確認）</label>
      <input type="password" id="newPasswordInput2" />
      <button class="save-btn" data-action="changeMyPassword" style="margin-top:12px">変更する</button>
    </div>`;
  }

  html += `
    <div class="card" style="background:#FBF8F2;font-size:12px;color:var(--muted)">
      ${infoA ? `<div>${isLocked(periodA) ? "🔒" : "📨"} 1〜15日分：提出期限 ${infoA.label}${isLocked(periodA) ? ` <span style="color:var(--rose)">（受付終了）</span>` : ""}</div>` : ""}
      ${infoB ? `<div style="margin-top:4px">${isLocked(periodB) ? "🔒" : "📨"} 16日〜月末分：提出期限 ${infoB.label}${isLocked(periodB) ? ` <span style="color:var(--rose)">（受付終了）</span>` : ""}</div>` : ""}
    </div>
    <div class="grid" style="margin-top:16px">
  `;

  for (const d of dates) {
    const dKey = dateKey(d);
    const weekend = isWeekendType(d);
    const entry = state.mySubmission[dKey];
    const locked = effectiveLocked(d);
    html += `<div class="card" style="${locked ? "opacity:.55" : ""}">
      <div style="display:flex;align-items:center;justify-content:space-between">
        ${dateLabelHtml(d, weekend)}
        ${locked ? `<span class="badge badge-locked">🔒 受付終了</span>` : ""}
      </div>`;
    for (const s of slotsForDate(d)) {
      const checked = ((entry && entry.slots) || []).includes(s.id);
      html += `<button class="slot-btn ${checked ? "checked" : ""}" data-action="toggleSlot" data-date="${dKey}" data-slot="${s.id}" ${locked ? "disabled" : ""}>
        <span>${esc(s.label)}（${s.start}〜${s.end}）</span><span>${checked ? "✓" : ""}</span>
      </button>`;
    }
    html += `</div>`;
  }
  html += `</div>
    <button class="submit-btn" data-action="submit">📨 この内容で希望シフトを送信</button>`;
  return html;
}

function slotEditorHtml(type, list, title) {
  let rows = "";
  for (const s of list) {
    rows += `<div class="slot-editor-row">
      <input type="text" value="${esc(s.label)}" data-action="slotLabel" data-type="${type}" data-id="${s.id}" placeholder="枠の名前" />
      <input type="time" value="${s.start}" data-action="slotStart" data-type="${type}" data-id="${s.id}" />
      〜
      <input type="time" value="${s.end}" data-action="slotEnd" data-type="${type}" data-id="${s.id}" />
      <button class="remove-btn" data-action="removeSlot" data-type="${type}" data-id="${s.id}">削除</button>
    </div>`;
  }
  return `<div class="section-title">${title}</div>${rows}
    <button class="add-btn" data-action="addSlot" data-type="${type}">＋ 枠を追加（人数を増やす）</button>`;
}

function staffEditorHtml() {
  let rows = "";
  state.staffDirectory.forEach((s, i) => {
    rows += `<div class="staff-row">
      <input type="text" value="${esc(s.name)}" data-action="staffName" data-index="${i}" placeholder="名前（ログインID）" />
      <input type="text" value="${esc(s.password)}" data-action="staffPassword" data-index="${i}" placeholder="パスワード" />
      <input type="number" value="${s.wage}" data-action="staffWage" data-index="${i}" placeholder="時給" min="0" step="10" />
      <button class="remove-btn" data-action="removeStaff" data-name="${esc(s.name)}">削除</button>
    </div>`;
  });
  return `<div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">👥 スタッフアカウント・時給の設定</div>
    <p style="font-size:12px;color:var(--muted2);margin:0 0 4px">名前がログインIDになります。パスワードはスタッフ側の画面でも変更できます。時給は打刻アプリの給与集計で使われます。</p>
    ${rows}
    <button class="add-btn" data-action="addStaff">＋ スタッフを追加</button>
    <button class="save-btn" style="display:block;margin-top:12px" data-action="saveStaffDirectory">💾 スタッフ情報を保存</button>
  </div>`;
}

function renderAdminTab() {
  const dates = daysInMonth(state.cursor.getFullYear(), state.cursor.getMonth());

  let html = `<div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">🕐 シフト時間・人数の設定</div>
    <p style="font-size:12px;color:var(--muted2);margin:0">枠を追加すると、その日の人数を増やせます。削除すると人数が減ります。</p>
    ${slotEditorHtml("weekday", state.weekdaySlots, "平日")}
    ${slotEditorHtml("weekend", state.weekendSlots, "土日祝")}
    <button class="save-btn" style="display:block;margin-top:16px" data-action="saveSlotsConfig">💾 シフト時間・人数を保存</button>
  </div>`;

  html += staffEditorHtml();

  html += `<div class="card" style="margin-top:12px">
    <div style="font-size:14px;font-weight:500;margin-bottom:8px">⚠ 祝日の設定（クリックで土日祝扱いを切替）</div>
    <div>`;
  for (const d of dates.filter((d) => d.getDay() !== 0 && d.getDay() !== 6)) {
    const dKey = dateKey(d);
    const isHol = state.holidays.includes(dKey);
    html += `<button class="holiday-chip ${isHol ? "active" : ""}" data-action="toggleHoliday" data-date="${dKey}">${d.getDate()}日</button>`;
  }
  html += `</div></div>`;

  if (state.staffDirectory.length === 0) {
    html += `<p style="font-size:14px;color:var(--muted2);margin:16px 0">まだスタッフが登録されていません。上の「スタッフアカウント」で追加してください。</p>`;
  }

  html += `<div style="margin-top:16px">`;
  for (const d of dates) {
    const dKey = dateKey(d);
    const weekend = isWeekendType(d);
    const conf = state.confirmed[dKey] || {};
    const deadlinePassed = isLocked(d);
    const unlocked = state.unlockedDates.includes(dKey);
    html += `<div class="card">${dateLabelHtml(d, weekend)}`;
    if (deadlinePassed) {
      html += `<button class="holiday-chip ${unlocked ? "active" : ""}" data-action="toggleUnlock" data-date="${dKey}" style="margin:8px 0 0">
        ${unlocked ? "🔓 受付延長中（クリックで締切に戻す）" : "🔒 締切済み（クリックで受付を再開）"}
      </button>`;
    }
    html += `<div style="margin-top:12px">`;
    for (const s of slotsForDate(d)) {
      html += assignRowHtml(`${s.label}（${s.start}〜${s.end}）`, conf[s.id] || "", availableStaffFor(dKey, s.id), dKey, s.id);
    }
    const cost = dailyCost(d);
    if (cost > 0) html += `<div class="cost-total">💰 この日の人件費：${fmtYen(cost)}</div>`;
    html += `</div></div>`;
  }
  html += `</div>
    <button class="save-btn" data-action="saveConfirmed">🔒 シフトを確定して保存</button>`;
  return html;
}

function assignRowHtml(label, value, options, dKey, field) {
  let opts = `<option value="">未定</option>`;
  for (const name of options) {
    opts += `<option value="${esc(name)}" ${value === name ? "selected" : ""}>${esc(name)}</option>`;
  }
  return `<div class="assign-row">
    <span class="assign-label">${esc(label)}</span>
    <select data-action="assign" data-date="${dKey}" data-field="${field}">${opts}</select>
  </div>`;
}

function renderReportTab() {
  const dates = daysInMonth(state.cursor.getFullYear(), state.cursor.getMonth());
  let rows = "";
  let monthTotal = 0;
  for (const d of dates) {
    const dKey = dateKey(d);
    const weekend = isWeekendType(d);
    const conf = state.confirmed[dKey] || {};
    const slots = slotsForDate(d);
    const assignedAny = slots.some((s) => conf[s.id]);
    const cost = dailyCost(d);
    monthTotal += cost;
    let cell = "";
    if (!assignedAny) cell = `<span style="color:var(--rose)">未確定</span>`;
    else cell = slots.filter((s) => conf[s.id]).map((s) => `<div>${esc(s.label)}：${esc(conf[s.id])}</div>`).join("");
    rows += `<tr><td>${dateLabelHtml(d, weekend)}</td><td>${cell}</td><td>${cost > 0 ? fmtYen(cost) : ""}</td></tr>`;
  }
  return `<div class="card">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">👥 確定シフト一覧</div>
    <table><thead><tr><th>日付</th><th>担当</th><th>人件費</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="grand-total">今月の人件費合計：${fmtYen(monthTotal)}</div>
  </div>`;
}

function renderStaffLoginGate() {
  let options = `<option value="">選択してください</option>`;
  for (const s of state.staffDirectory) options += `<option value="${esc(s.name)}">${esc(s.name)}</option>`;
  return `
    <header><div class="wrap header-row">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo-badge">📅</div>
        <div><h1 class="disp">シフト管理板<span class="tag">スタッフ用</span></h1></div>
      </div>
    </div></header>
    <div class="wrap" style="padding-top:60px;max-width:360px">
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔑 スタッフログイン</div>
        <label class="field-label">お名前</label>
        <select id="staffLoginName">${options}</select>
        <label class="field-label" style="margin-top:8px">パスワード</label>
        <input type="password" id="staffLoginPassword" />
        <button class="submit-btn" style="width:100%;justify-content:center;margin-top:12px" data-action="staffLogin">ログイン</button>
        ${state.flash ? `<div class="flash" style="margin-top:8px">${esc(state.flash)}</div>` : ""}
        <p style="font-size:11px;color:var(--muted2);margin-top:12px">ID・パスワードが分からない場合は管理者にご確認ください。</p>
      </div>
    </div>
  `;
}

function render() {
  const root = document.getElementById("root");

  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf("YOUR_APPS_SCRIPT") === 0) {
    root.innerHTML = `<div class="center-msg">
      <div style="font-size:32px">⚠</div>
      <p style="font-weight:700;margin-top:8px">API_URLが設定されていません</p>
      <p style="font-size:14px;margin-top:8px">このファイル内の <code>CONFIG.API_URL</code> に、Google Apps Scriptで発行したウェブアプリのURLを貼り付けてください。</p>
    </div>`;
    return;
  }

  if (state.route === "admin" && !state.adminAuthed) {
    root.innerHTML = `
      <header><div class="wrap header-row">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="logo-badge">📅</div>
          <div><h1 class="disp">シフト管理板<span class="tag">管理者用</span></h1></div>
        </div>
      </div></header>
      <div class="wrap" style="padding-top:60px;max-width:360px">
        <div class="card">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔒 管理者パスワード</div>
          <input type="password" id="adminPasswordInput" placeholder="パスワードを入力" />
          <button class="submit-btn" style="width:100%;justify-content:center;margin-top:12px" data-action="adminLogin">入る</button>
          ${state.flash ? `<div class="flash" style="margin-top:8px">${esc(state.flash)}</div>` : ""}
        </div>
      </div>
    `;
    const pw = document.getElementById("adminPasswordInput");
    if (pw) {
      pw.focus();
      pw.addEventListener("keydown", (e) => { if (e.key === "Enter") adminLogin(); });
    }
    return;
  }

  if (state.route === "staff" && !state.staffAuthed) {
    if (state.loading) {
      root.innerHTML = `<div class="center-msg">読み込み中…</div>`;
      return;
    }
    root.innerHTML = renderStaffLoginGate();
    const pw = document.getElementById("staffLoginPassword");
    if (pw) pw.addEventListener("keydown", (e) => { if (e.key === "Enter") staffLogin(); });
    return;
  }

  const tabs = state.route === "admin"
    ? [{ id: "admin", label: "🔒 シフト確定" }, { id: "report", label: "📋 確定シフト表" }]
    : [{ id: "input", label: "📨 希望シフト入力" }, { id: "report", label: "📋 確定シフト表" }];

  let body;
  if (state.loading) {
    body = `<div class="center-msg">読み込み中…</div>`;
  } else if (state.tab === "input") {
    body = renderInputTab();
  } else if (state.tab === "admin") {
    body = renderAdminTab();
  } else {
    body = renderReportTab();
  }

  root.innerHTML = `
    <header><div class="wrap header-row">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="logo-badge">📅</div>
        <div>
          <h1 class="disp">シフト管理板<span class="tag">${state.route === "admin" ? "管理者用" : "スタッフ用"}</span></h1>
          <p class="sub">平日ワンオペ・土日祝二部制</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        ${(state.saving || state.flash) ? `<div class="flash">${state.saving ? "保存中…" : esc(state.flash)}</div>` : ""}
        <a class="switch-link" href="${state.route === "admin" ? "#staff" : "#admin"}">${state.route === "admin" ? "スタッフ画面へ" : "管理者画面へ"}</a>
      </div>
    </div></header>
    <div class="wrap">
      <div class="month-nav">
        <button data-action="prevMonth">‹</button>
        <div class="month-label disp">${state.cursor.getFullYear()}年 ${state.cursor.getMonth() + 1}月</div>
        <button data-action="nextMonth">›</button>
      </div>
      <div class="tabs">
        ${tabs.map((t) => `<button class="tab-btn ${state.tab === t.id ? "active" : ""}" data-action="setTab" data-tab="${t.id}">${t.label}</button>`).join("")}
      </div>
      ${body}
    </div>
    <div class="footer-note">入力・確定内容はスタッフ全員が閲覧できる共有データ（Googleスプレッドシート）として保存されます。</div>
  `;
}

// ---- event delegation ----
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "prevMonth") changeMonth(-1);
  else if (action === "nextMonth") changeMonth(1);
  else if (action === "setTab") { state.tab = el.dataset.tab; render(); }
  else if (action === "toggleSlot") toggleSlot(el.dataset.date, el.dataset.slot);
  else if (action === "submit") submitMyShift();
  else if (action === "toggleHoliday") toggleHoliday(el.dataset.date);
  else if (action === "toggleUnlock") toggleUnlock(el.dataset.date);
  else if (action === "saveConfirmed") saveConfirmed();
  else if (action === "adminLogin") adminLogin();
  else if (action === "addSlot") addSlot(el.dataset.type);
  else if (action === "removeSlot") removeSlot(el.dataset.type, el.dataset.id);
  else if (action === "saveSlotsConfig") saveSlotsConfig();
  else if (action === "addStaff") addStaff();
  else if (action === "removeStaff") removeStaff(el.dataset.name);
  else if (action === "saveStaffDirectory") saveStaffDirectory();
  else if (action === "staffLogin") staffLogin();
  else if (action === "staffLogout") staffLogout();
  else if (action === "togglePasswordChange") { state.showPasswordChange = !state.showPasswordChange; render(); }
  else if (action === "changeMyPassword") changeMyPassword();
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "assign") assign(el.dataset.date, el.dataset.field, el.value);
  else if (action === "slotLabel") updateSlotField(el.dataset.type, el.dataset.id, "label", el.value);
  else if (action === "slotStart") updateSlotField(el.dataset.type, el.dataset.id, "start", el.value);
  else if (action === "slotEnd") updateSlotField(el.dataset.type, el.dataset.id, "end", el.value);
  else if (action === "staffName") updateStaffField(Number(el.dataset.index), "name", el.value);
  else if (action === "staffWage") updateStaffField(Number(el.dataset.index), "wage", el.value);
  else if (action === "staffPassword") updateStaffField(Number(el.dataset.index), "password", el.value);
});
window.addEventListener("hashchange", () => {
  state.route = readRoute();
  state.tab = state.route === "admin" ? "admin" : "input";
  render();
});

// ---- boot ----
(async function init() {
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf("YOUR_APPS_SCRIPT") === 0) { render(); return; }
  state.loading = true;
  render();
  await loadStaffDirectory();
  if (state.route === "admin") {
    if (state.adminAuthed) { loadMonthData(); } else { state.loading = false; render(); }
  } else {
    if (state.staffAuthed && state.staffDirectory.find((s) => s.name === state.staffName)) {
      loadMonthData();
    } else {
      state.staffAuthed = false;
      state.loading = false;
      render();
    }
  }
})();
</script>
</body>
</html>
